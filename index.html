<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="btns">
        <button class="rock" onclick="playRound('rock')">
            <img src="icons/rock.png" alt="rock">
        </button>
        <button class="paper" onclick="playRound('paper')">
            <img src="icons/paper.png" alt="paper">
        </button>
        <button class="scissors" onclick="playRound('scissor')">
            <img src="icons/scissor.png" alt="scissor">
        </button>
    </div>

    <div id="score"></div>
    

    <script src="script.js"></script>
</body>
</html>
